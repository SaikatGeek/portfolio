server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # --- Compression ---
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json image/svg+xml;

    # NGINX GOTCHA: a location block that declares ANY add_header of its own
    # inherits NONE from the server level. So security headers must be
    # repeated inside every location that sets its own headers.
    # Do NOT "deduplicate" them back to server level — they would silently
    # stop being sent.

    # --- Health endpoint (Docker + Traefik healthchecks) ---
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --- Long cache for static assets (immutable-ish) ---
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files  $uri =404;
    }

    # --- HTML: no cache so deploys show up immediately ---
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files  $uri $uri/ /index.html;
    }
}
